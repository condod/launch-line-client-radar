services:
  - type: web
    name: launch-line-voice
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build:server
    startCommand: npm run server:start
    healthCheckPath: /api/health
    disk:
      name: launch-line-call-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CALL_DATA_FILE
        value: /var/data/call-center.json
      - key: BUSINESS_PHONE_E164
        value: +19417803258
      - key: HUMAN_TRANSFER_PHONE_E164
        value: +19417352514
      - key: DASHBOARD_ORIGINS
        value: https://condod.github.io,http://127.0.0.1:4191
      - key: TWILIO_VALIDATE_WEBHOOKS
        value: "true"
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1-mini
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DASHBOARD_API_KEY
        generateValue: true
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_PROJECT_ID
        sync: false
      - key: OPENAI_WEBHOOK_SECRET
        sync: false
